syntax = "proto3";
package kratos.api;

option go_package = "fakery/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  Etcd etcd = 3;

  message Etcd {
    repeated string endpoints = 1;
    google.protobuf.Duration timeout = 2;
    Registry registry = 3;
    Config config = 4;

    message Registry {
      string namespace = 1;
      google.protobuf.Duration ttl = 2;
      Service service = 3;

      message Service {
        string name = 1;
        string version = 2;
        map<string, string> metadata = 3;
      }
    }

    message Config {
      string namespace = 1;
      google.protobuf.Duration watch_timeout = 2;
    }
  }
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}
