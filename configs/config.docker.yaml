server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
  # etcd config
  etcd:
    endpoints:
      - "etcd:2379"
    timeout: 5s
    # 服务注册配置
    registry:
      namespace: "/fakery/services"
      ttl: 30s
      # 服务实例信息
      service:
        name: "fakery"
        version: "v1.0.0"
        metadata:
          weight: "100"
          region: "default"
    # 配置管理
    config:
      namespace: "/fakery/config"
      watch_timeout: 10s
data:
  database:
    driver: mysql
    source: root:root@tcp(127.0.0.1:3306)/test?parseTime=True&loc=Local
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s

log:
  level: "info"
  enable_file_log: false
  file_path: "./logs/app.log"
